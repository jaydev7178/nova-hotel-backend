spring:
  datasource:
    url: ${DATABASE_URL:jdbc:sqlserver://sql.bsite.net\\MSSQL2016;databaseName=${DB_NAME:jaydev_nova_hotel_db};encrypt=true;trustServerCertificate=false}
    username: ${DB_USERNAME:jaydev_nova_hotel_db}
    password: ${DB_PASSWORD:admin@123}
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
    dialect: org.hibernate.dialect.SQLServer2012Dialect

# Production specific settings
  logging:
  level:
    com.novahotel: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# CORS for production
  app:
  cors:
    allowed-origins: ${CORS_ORIGINS:https://novahotelsupplies.com,https://www.novahotelsupplies.com}

# Security
  jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400}

# Email configuration
  spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: ${MAIL_HOST}

