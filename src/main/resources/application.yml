spring:
  application:
    name: nova-hotel-backend
  
  profiles:
    active: dev
  
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nova_hotel_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}"
    jdbc-url: "${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nova_hotel_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin@123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKey123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400} # 24 hours in seconds

# Application Configuration
app:
  owner:
    email: ${OWNER_EMAIL:owner@novahotelsupplies.com}
  
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# Logging
logging:
  level:
    '[com.novahotel]': DEBUG
    '[org.springframework.security]': TRACE
    '[org.springframework.web]': TRACE
    '[org.springframework.security.web.FilterChainProxy]': TRACE
    '[org.springframework.security.web.access]': TRACE
    '[org.hibernate.SQL]': DEBUG
    '[org.hibernate.type.descriptor.sql.BasicBinder]': TRACE

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Server configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

