spring.application.name=nova-hotel-backend
# Active profile default (dev is set in application.yml)
spring.profiles.active=dev

# Fallback datasource (prefer SPRING_DATASOURCE_URL or profile-specific config)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nova_hotel_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
