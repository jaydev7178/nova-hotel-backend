spring:
  datasource:
    # MSSQL datasource - override with SPRING_DATASOURCE_URL if needed
    url: "${SPRING_DATASOURCE_URL:jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:nova_hotel_db};encrypt=false;trustServerCertificate=true}"
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:admin@123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # use none in dev since schema is already created
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServer2012Dialect
        format_sql: true

# Development specific settings
logging:
  level:
    com.novahotel: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Server configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

# CORS for development
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000

